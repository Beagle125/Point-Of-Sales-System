services:
  pos-app:
    build: ./pos-app
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_ROOT_PASSWORD}@pos-db:3306/${MYSQL_DATABASE:-local}"
    ports:
      - "5173:5173"

  pos-db:
    build: ./pos-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./pos-db/db-files:/var/lib/mysql